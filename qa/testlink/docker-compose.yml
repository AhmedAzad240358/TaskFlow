name: taskflow-project1-20261026
services:
  db:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: testlink
      MARIADB_USER: testlink
      MARIADB_PASSWORD: testlink
    volumes:
      - db:/var/lib/mysql
      # Clean upstream schema and default data, loaded only into this project's fresh volume.
      - ./seed:/docker-entrypoint-initdb.d:ro
  web:
    build: .
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "127.0.0.1:${TESTLINK_PORT:-8090}:80"
    volumes:
      - ./app:/var/www/html
volumes:
  db:
